[project]
name = "routehub"
version = "0.2.0"
description = "A fast, lightweight LLM gateway with a litellm-compatible API, built on the OpenAI SDK."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Kye Gomez", email = "kye@swarms.world" }]
requires-python = ">=3.10"
keywords = [
    "llm",
    "gateway",
    "litellm",
    "openai",
    "anthropic",
    "ai",
    "agents",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "openai>=1.68",
    "pydantic>=2.0",
    "tiktoken>=0.7",
]

[project.optional-dependencies]
fast = ["orjson>=3.9"]
vertex = ["google-auth[requests]>=2.0"]

[project.urls]
Homepage = "https://github.com/The-Swarm-Corporation/RouteHub"
Documentation = "https://github.com/The-Swarm-Corporation/RouteHub#readme"
Repository = "https://github.com/The-Swarm-Corporation/RouteHub"
Issues = "https://github.com/The-Swarm-Corporation/RouteHub/issues"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["routehub"]

[tool.hatch.build.targets.sdist]
include = ["routehub", "tests", "README.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.ruff]
line-length = 70
target-version = "py310"

[tool.ruff.lint]
# Pyflakes, pycodestyle errors and import order, the rules swarms lints with.
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"routehub/__init__.py" = ["F401"]
"tests/**" = ["E402", "E721", "E722", "F401", "F402"]

[tool.black]
line-length = 70

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.10",
]
